<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출결 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a18;min-height:100vh;padding:24px 16px}
.app{max-width:820px;margin:0 auto}
.header{margin-bottom:1.25rem}
.header h1{font-size:20px;font-weight:500}
.header p{font-size:13px;color:#888;margin-top:4px}
.top-bar{display:flex;align-items:center;gap:12px;margin-bottom:1rem;flex-wrap:wrap}
.month-nav{display:flex;align-items:center;gap:8px}
.month-nav button{background:#fff;border:1px solid #ddd;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.month-nav button:hover{background:#f0f0ee}
.month-label{font-size:15px;font-weight:500;min-width:90px;text-align:center}
.actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.btn{padding:6px 14px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:13px}
.btn:hover{background:#f0f0ee}
.btn.primary{border-color:#aaa;font-weight:500}
.mode-toggle{display:flex;gap:4px}
.mode-btn{padding:5px 16px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:13px;color:#888;transition:all 0.15s}
.mode-btn:hover{background:#f0f0ee}
.saving{position:fixed;top:16px;right:16px;background:#1a1a18;color:#fff;font-size:12px;padding:6px 12px;border-radius:8px;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999}
.saving.show{opacity:1}
.dashboard{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem}
.dash-section{background:#eeecea;border-radius:12px;padding:12px 16px}
.dash-section-title{font-size:11px;font-weight:500;color:#888;letter-spacing:.05em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.dash-cells{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dash-cell{background:#fff;border-radius:8px;padding:10px 8px;text-align:center;border:1px solid #e8e8e6}
.dash-val{font-size:20px;font-weight:500;line-height:1}
.dash-lbl{font-size:10px;color:#888;margin-top:4px;line-height:1.3}
.dash-cell.good .dash-val{color:#3B6D11}
.dash-cell.warn .dash-val{color:#BA7517}
.dash-cell.bad .dash-val{color:#A32D2D}
.dash-cell.need .dash-val{color:#185FA5}
.rate-wrap{margin-bottom:1rem}
.rate-label{display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:4px}
.rate-goal{position:relative;height:10px;background:#ddd;border-radius:5px;overflow:visible}
.rate-goal-fill{height:100%;border-radius:5px;transition:width 0.4s}
.rate-goal-line{position:absolute;top:-4px;bottom:-4px;width:2px;background:#888;border-radius:1px;opacity:.6}
.rate-goal-line::after{content:'목표 60%';position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:#888;white-space:nowrap}
.rate-good{background:#639922}.rate-warn{background:#EF9F27}.rate-bad{background:#E24B4A}
.legend{display:flex;gap:12px;margin-bottom:1rem;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#888}
.legend-dot{width:10px;height:10px;border-radius:2px}
.ld-attend{background:#C0DD97}.ld-absent{background:#F7C1C1}
.ld-holiday{background:#FFF5F0;border:1px solid #F5C4B3}
.ld-election{background:#EEF2FF;border:1px solid #B5D4F4}
.ld-weekend{background:#eeecea;border:1px solid #ddd}
.calendar-wrap{background:#fff;border:1px solid #e8e8e6;border-radius:12px;overflow:hidden;margin-bottom:1rem}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid #e8e8e6}
.cal-head div{text-align:center;padding:8px 0;font-size:12px;color:#888;font-weight:500}
.cal-head .sun{color:#D85A30}.cal-head .sat{color:#378ADD}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.day{border-bottom:1px solid #e8e8e6;border-right:1px solid #e8e8e6;min-height:68px;padding:5px 6px;cursor:default;transition:background 0.1s}
.day:nth-child(7n){border-right:none}
.day.other{opacity:0.25}
.day.is-weekend{background:#f5f5f3}
.day.is-holiday{background:#FFF5F0}
.day.is-election{background:#EEF2FF}
.day.is-workday:hover{background:#f0f0ee;cursor:pointer}
.day.selected-attend{background:#EAF3DE !important}
.day.selected-absent{background:#FCEBEB !important}
.day-num{font-size:12px;color:#888;font-weight:500;line-height:1}
.day.is-sun .day-num{color:#D85A30}.day.is-sat .day-num{color:#378ADD}
.day.is-holiday .day-num{color:#993C1D}.day.is-election .day-num{color:#185FA5}
.day.is-today .day-num{background:#185FA5;color:#fff;width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:10px}
.holi-name{font-size:9px;color:#993C1D;display:block;margin-top:2px;line-height:1.2;word-break:keep-all}
.day.is-election .holi-name{color:#185FA5}
.status-badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:20px;margin-top:3px;font-weight:500}
.badge-attend{background:#C0DD97;color:#3B6D11}.badge-absent{background:#F7C1C1;color:#A32D2D}
.list-section{background:#fff;border:1px solid #e8e8e6;border-radius:12px;overflow:hidden}
.list-toggle-btn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:transparent;border:none;cursor:pointer;text-align:left}
.list-toggle-btn:hover{background:#f5f5f3}
.list-toggle-left{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:#888}
.list-toggle-right{display:flex;align-items:center;gap:8px}
.list-count-badges{display:flex;gap:6px}
.list-chevron{font-size:16px;color:#888;transition:transform 0.25s}
.list-chevron.open{transform:rotate(180deg)}
.list-body-wrap{max-height:0;overflow:hidden;transition:max-height 0.35s cubic-bezier(0.4,0,0.2,1)}
.list-body-wrap.open{max-height:2000px}
.list-divider{border-top:1px solid #e8e8e6}
.list-row{display:flex;align-items:center;padding:8px 16px;border-bottom:1px solid #e8e8e6;font-size:13px;gap:8px}
.list-row:last-child{border-bottom:none}
.list-date{min-width:80px}
.list-status{flex:1}
.list-row button{background:transparent;border:none;cursor:pointer;font-size:13px;color:#888;padding:2px 6px;border-radius:4px}
.list-row button:hover{background:#f0f0ee}
.empty-state{padding:2rem;text-align:center;color:#888;font-size:13px}
</style>
</head>
<body>
<div class="saving" id="savingToast">저장 중...</div>
<div class="app">
  <div class="header">
    <h1>출결 관리</h1>
    <p>워킹데이(평일·공휴일·선거일 제외)를 클릭해 출석/결석을 기록하세요. 분기 출석률 60% 이상 유지 목표.</p>
  </div>
  <div class="top-bar">
    <div class="month-nav">
      <button id="prevMonth">◀</button>
      <span class="month-label" id="monthLabel"></span>
      <button id="nextMonth">▶</button>
    </div>
    <div class="mode-toggle">
      <button class="mode-btn" id="modeAttend" onclick="setMode('attend')">출석</button>
      <button class="mode-btn" id="modeAbsent" onclick="setMode('absent')">결석</button>
      <button class="mode-btn" id="modeClear" onclick="setMode('clear')">지우기</button>
    </div>
    <div class="actions">
      <button class="btn" onclick="selectAllWorkdays()">이달 전체 출석</button>
      <button class="btn" onclick="clearMonth()">이달 초기화</button>
      <button class="btn primary" onclick="exportCSV()"><i class="ti ti-download"></i> CSV</button>
    </div>
  </div>
  <div class="dashboard" id="dashboard"></div>
  <div class="rate-wrap">
    <div class="rate-label"><span id="rateText"></span><span id="ratePct"></span></div>
    <div class="rate-goal">
      <div class="rate-goal-fill" id="rateFill"></div>
      <div class="rate-goal-line" style="left:60%"></div>
    </div>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot ld-attend"></div>출석</div>
    <div class="legend-item"><div class="legend-dot ld-absent"></div>결석</div>
    <div class="legend-item"><div class="legend-dot ld-holiday"></div>공휴일</div>
    <div class="legend-item"><div class="legend-dot ld-election"></div>선거일</div>
    <div class="legend-item"><div class="legend-dot ld-weekend"></div>주말</div>
  </div>
  <div class="calendar-wrap">
    <div class="cal-head">
      <div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>
  <div class="list-section">
    <button class="list-toggle-btn" onclick="toggleList()" id="listToggleBtn">
      <span class="list-toggle-left"><i class="ti ti-list-check"></i>기록된 출결 내역</span>
      <span class="list-toggle-right">
        <span class="list-count-badges" id="listCountBadges"></span>
        <i class="ti ti-chevron-down list-chevron" id="listChevron"></i>
      </span>
    </button>
    <div class="list-body-wrap" id="listBodyWrap">
      <div class="list-divider"></div>
      <div id="listBody"></div>
    </div>
  </div>
</div>

<!-- Firebase 초기화 (일반 스크립트) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyBA2K7bGlNouiplaWKEnadOONdftOFX8g0",
  authDomain: "project-thinkai.firebaseapp.com",
  projectId: "project-thinkai",
  storageBucket: "project-thinkai.firebasestorage.app",
  messagingSenderId: "248636917430",
  appId: "1:248636917430:web:3cda334e2397d946618817"
});
const db = firebase.firestore();
const DOC_REF = db.collection('attendance').doc('data');

const HOLIDAYS={
  '2025-01-01':'신정','2025-01-28':'설날 연휴','2025-01-29':'설날','2025-01-30':'설날 연휴',
  '2025-03-01':'삼일절','2025-05-05':'어린이날','2025-05-06':'대체공휴일','2025-06-06':'현충일',
  '2025-08-15':'광복절','2025-10-03':'개천절','2025-10-05':'추석 연휴','2025-10-06':'추석',
  '2025-10-07':'추석 연휴','2025-10-08':'대체공휴일','2025-10-09':'한글날','2025-12-25':'성탄절',
  '2026-01-01':'신정','2026-02-16':'설날 연휴','2026-02-17':'설날','2026-02-18':'설날 연휴',
  '2026-03-01':'삼일절','2026-05-01':'노동절','2026-05-05':'어린이날','2026-05-25':'부처님오신날','2026-06-06':'현충일',
  '2026-08-15':'광복절','2026-09-24':'추석 연휴','2026-09-25':'추석','2026-09-26':'추석 연휴',
  '2026-10-03':'개천절','2026-10-09':'한글날','2026-12-25':'성탄절',
};
const ELECTIONS={'2026-06-03':'전국동시지방선거'};

let attendance={};
let mode='attend';
let listOpen=false;
let saveTimer=null;
const today=new Date();
let viewYear=today.getFullYear();
let viewMonth=today.getMonth();

function showToast(msg){const t=document.getElementById('savingToast');t.textContent=msg;t.classList.add('show');}
function hideToast(){document.getElementById('savingToast').classList.remove('show');}

function save(){
  clearTimeout(saveTimer);
  showToast('저장 중...');
  saveTimer=setTimeout(function(){
    DOC_REF.set(attendance)
      .then(function(){ showToast('저장됨 ✓'); setTimeout(hideToast,1500); })
      .catch(function(){ showToast('저장 실패'); setTimeout(hideToast,2000); });
  }, 800);
}

function dk(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function isWeekend(dt){return dt.getDay()===0||dt.getDay()===6;}
function isHoliday(k){return !!HOLIDAYS[k];}
function isElection(k){return !!ELECTIONS[k];}
function isWorkday(y,m,d){var dt=new Date(y,m,d);var k=dk(y,m,d);return !isWeekend(dt)&&!isHoliday(k)&&!isElection(k);}

var BTN_STYLES={
  attend:{background:'#3B6D11',borderColor:'#3B6D11',color:'#fff'},
  absent:{background:'#A32D2D',borderColor:'#A32D2D',color:'#fff'},
  clear:{background:'#444441',borderColor:'#444441',color:'#fff'}
};

function setMode(m){
  mode=m;
  ['attend','absent','clear'].forEach(function(x){
    var btn=document.getElementById('mode'+x.charAt(0).toUpperCase()+x.slice(1));
    if(x===m){btn.style.background=BTN_STYLES[x].background;btn.style.borderColor=BTN_STYLES[x].borderColor;btn.style.color=BTN_STYLES[x].color;btn.style.fontWeight='500';}
    else{btn.style.background='';btn.style.borderColor='';btn.style.color='';btn.style.fontWeight='';}
  });
}

function toggleList(){
  listOpen=!listOpen;
  document.getElementById('listBodyWrap').classList.toggle('open',listOpen);
  document.getElementById('listChevron').classList.toggle('open',listOpen);
}

function getQuarterKeys(y,qIdx){
  var qs=qIdx*3;var keys=[];
  for(var mo=qs;mo<qs+3;mo++){var dim=new Date(y,mo+1,0).getDate();for(var d=1;d<=dim;d++){if(isWorkday(y,mo,d))keys.push(dk(y,mo,d));}}
  return keys;
}

function calcStats(){
  var q=Math.floor(viewMonth/3);var dim=new Date(viewYear,viewMonth+1,0).getDate();
  var mWork=0,mAtt=0,mAbs=0;
  for(var d=1;d<=dim;d++){var k=dk(viewYear,viewMonth,d);if(isWorkday(viewYear,viewMonth,d)){mWork++;if(attendance[k]==='attend')mAtt++;if(attendance[k]==='absent')mAbs++;}}
  var qKeys=getQuarterKeys(viewYear,q);var qTotal=qKeys.length;
  var qAtt=qKeys.filter(function(k){return attendance[k]==='attend';}).length;
  var qRate=qTotal>0?Math.round(qAtt/qTotal*100):0;
  var needed=Math.ceil(qTotal*0.6);var remaining=Math.max(0,needed-qAtt);
  return{mWork:mWork,mAtt:mAtt,mAbs:mAbs,qTotal:qTotal,qAtt:qAtt,qRate:qRate,needed:needed,remaining:remaining,qNum:q+1};
}

function renderDashboard(){
  var s=calcStats();
  var rCls=s.qRate>=60?'good':s.qRate>=50?'warn':'bad';
  var remCls=s.remaining===0?'good':s.remaining<=3?'warn':'need';
  document.getElementById('dashboard').innerHTML=
    '<div class="dash-section"><div class="dash-section-title"><i class="ti ti-calendar-month"></i> 이달</div><div class="dash-cells">'+
    '<div class="dash-cell"><div class="dash-val">'+s.mWork+'</div><div class="dash-lbl">워킹데이</div></div>'+
    '<div class="dash-cell"><div class="dash-val">'+s.mAtt+'</div><div class="dash-lbl">출석일</div></div>'+
    '<div class="dash-cell"><div class="dash-val">'+s.mAbs+'</div><div class="dash-lbl">결석일</div></div>'+
    '</div></div>'+
    '<div class="dash-section"><div class="dash-section-title"><i class="ti ti-chart-bar"></i> '+s.qNum+'분기</div><div class="dash-cells">'+
    '<div class="dash-cell"><div class="dash-val">'+s.qTotal+'</div><div class="dash-lbl">전체 워킹데이</div></div>'+
    '<div class="dash-cell '+rCls+'"><div class="dash-val">'+s.qAtt+'</div><div class="dash-lbl">출석일 ('+s.qRate+'%)</div></div>'+
    '<div class="dash-cell '+remCls+'"><div class="dash-val">'+s.remaining+'</div><div class="dash-lbl">잔여 필요<br>출석일'+(s.remaining===0?' ✓':'')+'</div></div>'+
    '</div></div>';
  document.getElementById('rateText').textContent=s.qNum+'분기 출석률 — 워킹데이 '+s.qTotal+'일 중 '+s.qAtt+'일 / 60% 달성 필요 '+s.needed+'일';
  document.getElementById('ratePct').textContent=s.qRate+'%';
  var fill=document.getElementById('rateFill');
  fill.style.width=Math.min(s.qRate,100)+'%';
  fill.className='rate-goal-fill '+(s.qRate>=60?'rate-good':s.qRate>=50?'rate-warn':'rate-bad');
}

function renderCalendar(){
  var grid=document.getElementById('calGrid');
  var first=new Date(viewYear,viewMonth,1);var dim=new Date(viewYear,viewMonth+1,0).getDate();
  var startDow=first.getDay();var prevDim=new Date(viewYear,viewMonth,0).getDate();
  var html='';
  for(var i=startDow-1;i>=0;i--)html+='<div class="day other"><span class="day-num">'+(prevDim-i)+'</span></div>';
  for(var d=1;d<=dim;d++){
    var k=dk(viewYear,viewMonth,d);var dt=new Date(viewYear,viewMonth,d);var dow=dt.getDay();
    var wd=isWorkday(viewYear,viewMonth,d);var hname=HOLIDAYS[k]||'';var ename=ELECTIONS[k]||'';
    var isToday=viewYear===today.getFullYear()&&viewMonth===today.getMonth()&&d===today.getDate();
    var cls='day';
    if(dow===0)cls+=' is-sun';if(dow===6)cls+=' is-sat';
    if(ename)cls+=' is-election';else if(hname)cls+=' is-holiday';else if(isWeekend(dt))cls+=' is-weekend';
    if(wd)cls+=' is-workday';
    if(attendance[k]==='attend')cls+=' selected-attend';if(attendance[k]==='absent')cls+=' selected-absent';
    if(isToday)cls+=' is-today';
    var inner='<span class="day-num">'+d+'</span>';
    if(ename)inner+='<span class="holi-name">'+ename+'</span>';else if(hname)inner+='<span class="holi-name">'+hname+'</span>';
    if(attendance[k]==='attend')inner+='<span class="status-badge badge-attend">출석</span>';
    if(attendance[k]==='absent')inner+='<span class="status-badge badge-absent">결석</span>';
    html+='<div class="'+cls+'"'+(wd?' onclick="handleClick('+viewYear+','+viewMonth+','+d+')"':'')+'>'+inner+'</div>';
  }
  var rem=(7-(startDow+dim)%7)%7;
  for(var i=1;i<=rem;i++)html+='<div class="day other"><span class="day-num">'+i+'</span></div>';
  grid.innerHTML=html;
}

function handleClick(y,m,d){
  var k=dk(y,m,d);
  if(mode==='clear')delete attendance[k];else if(attendance[k]===mode)delete attendance[k];else attendance[k]=mode;
  save();render();
}

function selectAllWorkdays(){
  var dim=new Date(viewYear,viewMonth+1,0).getDate();
  for(var d=1;d<=dim;d++){if(isWorkday(viewYear,viewMonth,d))attendance[dk(viewYear,viewMonth,d)]='attend';}
  save();render();
}

function clearMonth(){
  var dim=new Date(viewYear,viewMonth+1,0).getDate();
  for(var d=1;d<=dim;d++)delete attendance[dk(viewYear,viewMonth,d)];
  save();render();
}

function renderList(){
  var entries=Object.entries(attendance).filter(function(e){var p=e[0].split('-').map(Number);return p[0]===viewYear&&p[1]===viewMonth+1;}).sort(function(a,b){return a[0].localeCompare(b[0]);});
  var body=document.getElementById('listBody');var badges=document.getElementById('listCountBadges');
  var attCount=entries.filter(function(e){return e[1]==='attend';}).length;
  var absCount=entries.filter(function(e){return e[1]==='absent';}).length;
  badges.innerHTML=entries.length?(attCount?'<span class="status-badge badge-attend">출석 '+attCount+'</span>':'')+(absCount?'<span class="status-badge badge-absent">결석 '+absCount+'</span>':''):'<span style="font-size:12px;color:#888">기록 없음</span>';
  if(!entries.length){body.innerHTML='<div class="empty-state">이달 기록 없음</div>';return;}
  var wdays=['일','월','화','수','목','금','토'];
  body.innerHTML=entries.map(function(e){var k=e[0];var v=e[1];var dt=new Date(k);return '<div class="list-row"><span class="list-date">'+k.slice(5)+' ('+wdays[dt.getDay()]+')</span><span class="list-status"><span class="status-badge '+(v==='attend'?'badge-attend':'badge-absent')+'">'+(v==='attend'?'출석':'결석')+'</span></span><button onclick="toggleEntry(\''+k+'\')"><i class="ti ti-arrows-exchange"></i></button><button onclick="delEntry(\''+k+'\')"><i class="ti ti-x"></i></button></div>';}).join('');
}

function toggleEntry(k){attendance[k]=attendance[k]==='attend'?'absent':'attend';save();render();}
function delEntry(k){delete attendance[k];save();render();}

function exportCSV(){
  var rows=[['날짜','요일','상태']];var wdays=['일','월','화','수','목','금','토'];
  Object.entries(attendance).sort(function(a,b){return a[0].localeCompare(b[0]);}).forEach(function(e){rows.push([e[0],wdays[new Date(e[0]).getDay()],e[1]==='attend'?'출석':'결석']);});
  var csv=rows.map(function(r){return r.join(',');}).join('\n');
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='출결기록.csv';a.click();URL.revokeObjectURL(url);
}

function render(){
  document.getElementById('monthLabel').textContent=viewYear+'년 '+(viewMonth+1)+'월';
  renderDashboard();renderCalendar();renderList();
}

document.getElementById('prevMonth').onclick=function(){viewMonth--;if(viewMonth<0){viewMonth=11;viewYear--;}render();};
document.getElementById('nextMonth').onclick=function(){viewMonth++;if(viewMonth>11){viewMonth=0;viewYear++;}render();};

// 초기 데이터 로드
DOC_REF.get().then(function(snap){
  if(snap.exists) attendance=snap.data();
  render();
  setMode('attend');
}).catch(function(){
  render();
  setMode('attend');
});
</script>
